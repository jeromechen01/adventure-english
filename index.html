<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <meta name="theme-color" content="#FF8A4C" />
  <title>英语奇遇记 English Adventure</title>
  <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Ctext y='.9em' font-size='90'%3E🦊%3C/text%3E%3C/svg%3E" />
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="assets/css/style.css" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            primary: '#FF8A4C',
            'primary-dark': '#E76F33',
            secondary: '#4ECDC4',
            'secondary-dark': '#38B2AC',
            cream: '#FFF8F0'
          }
        }
      }
    };
  </script>
</head>
<body class="bg-cream has-bottom-nav">

  <!-- 顶部导航栏 -->
  <header id="topNav" class="sticky top-0 z-40 bg-white shadow-sm">
    <div class="max-w-3xl mx-auto px-4 py-3 flex items-center justify-between">
      <div class="flex items-center gap-2">
        <div class="text-3xl">🦊</div>
        <div>
          <div class="font-bold text-base leading-tight">英语奇遇记</div>
          <div class="text-[10px] text-gray-500 font-en leading-tight">English Adventure</div>
        </div>
      </div>
      <div class="flex items-center gap-2">
        <button id="gradeBtn" class="text-xs bg-orange-100 text-primary-dark px-3 py-1.5 rounded-full font-bold tap-bounce">
          <span id="gradeLabel">三年级</span> ⌄
        </button>
        <div class="flex items-center gap-1 bg-yellow-50 px-2 py-1 rounded-full">
          <span>🪙</span>
          <span id="coinDisplay" class="font-bold text-sm">0</span>
        </div>
        <div class="flex items-center gap-1 bg-orange-50 px-2 py-1 rounded-full">
          <span>🔥</span>
          <span id="streakDisplay" class="font-bold text-sm">0</span>
        </div>
      </div>
    </div>
  </header>

  <!-- 内容容器 -->
  <main id="app" class="max-w-3xl mx-auto px-4 py-4 fade-in">
    <!-- 这里由 app.js 注入页面 -->
    <div id="bootMsg" class="text-center py-20 text-gray-400">加载中...</div>
  </main>

  <!-- 检测 file:// 协议给用户友好提示 -->
  <script>
    if (location.protocol === 'file:') {
      document.getElementById('bootMsg').innerHTML = `
        <div style="max-width:480px;margin:0 auto;padding:32px 24px;background:#FFF5F0;border-radius:24px;border:2px solid #FFB68A">
          <div style="font-size:48px">⚠️</div>
          <h3 style="font-size:18px;font-weight:bold;margin:12px 0;color:#E76F33">不能直接双击打开</h3>
          <p style="font-size:14px;color:#666;line-height:1.7;text-align:left;margin:16px 0">
            浏览器的安全策略不允许 <code style="background:#fff;padding:2px 6px;border-radius:4px">file://</code> 模式加载本地数据文件，请用以下任一方式访问：
          </p>
          <div style="font-size:13px;color:#444;line-height:1.8;text-align:left;background:#fff;padding:14px 16px;border-radius:12px;margin:16px 0">
            <strong style="color:#FF8A4C">推荐: 部署到 GitHub Pages</strong><br>
            按 README.md 里的教程上传到 GitHub 即可<br><br>
            <strong style="color:#FF8A4C">本地测试: 用 Python 起服务</strong><br>
            1. 打开命令提示符 (Win+R 输入 cmd)<br>
            2. 进入项目文件夹: <code style="background:#FFF5F0;padding:1px 4px">cd 你的路径\\english-adventure</code><br>
            3. 启动服务: <code style="background:#FFF5F0;padding:1px 4px">python -m http.server 8000</code><br>
            4. 浏览器访问 <code style="background:#FFF5F0;padding:1px 4px">http://localhost:8000</code>
          </div>
          <p style="font-size:12px;color:#999;margin-top:12px">
            没装 Python? 也可以用 VS Code + Live Server 插件,或直接传到 GitHub Pages
          </p>
        </div>
      `;
    }
  </script>

  <!-- 底部导航 -->
  <nav id="bottomNav" class="fixed bottom-0 left-0 right-0 bg-white border-t border-gray-100 z-40">
    <div class="max-w-3xl mx-auto grid grid-cols-5 py-2">
      <button data-page="home" class="nav-btn flex flex-col items-center gap-0.5 py-1 text-gray-400 active:scale-95 transition">
        <span class="text-xl">🏠</span><span class="text-[10px]">首页</span>
      </button>
      <button data-page="learn" class="nav-btn flex flex-col items-center gap-0.5 py-1 text-gray-400 active:scale-95 transition">
        <span class="text-xl">📚</span><span class="text-[10px]">学习</span>
      </button>
      <button data-page="mistakes" class="nav-btn flex flex-col items-center gap-0.5 py-1 text-gray-400 active:scale-95 transition">
        <span class="text-xl">📝</span><span class="text-[10px]">错题本</span>
      </button>
      <button data-page="leaderboard" class="nav-btn flex flex-col items-center gap-0.5 py-1 text-gray-400 active:scale-95 transition">
        <span class="text-xl">🏆</span><span class="text-[10px]">排行榜</span>
      </button>
      <button data-page="me" class="nav-btn flex flex-col items-center gap-0.5 py-1 text-gray-400 active:scale-95 transition">
        <span class="text-xl">👤</span><span class="text-[10px]">我的</span>
      </button>
    </div>
  </nav>

  <!-- 弹窗容器 -->
  <div id="modalRoot"></div>
  <div id="toastRoot" class="fixed top-20 left-0 right-0 flex justify-center pointer-events-none z-50"></div>

  <!-- 应用脚本 -->
  <script type="module" src="assets/js/app.js"></script>
</body>
</html>
