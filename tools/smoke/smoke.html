<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8" />
<title>smoke</title>
<link rel="stylesheet" href="assets/css/style.css" />
<script>
  window.__errs = [];
  window.addEventListener('error', e => window.__errs.push('error: ' + (e.message || e.error)));
  window.addEventListener('unhandledrejection', e => window.__errs.push('rejection: ' + ((e.reason && e.reason.message) || e.reason)));
  const _ce = console.error;
  console.error = function (...a) { window.__errs.push('console.error: ' + a.map(x => (x && x.message) || String(x)).join(' ')); _ce.apply(console, a); };
</script>
</head>
<body>
  <header id="topNav"><button id="gradeBtn"><span id="gradeLabel">三年级</span></button>
    <span id="coinDisplay">0</span><span id="daysDisplay">0</span></header>
  <main id="app"></main>
  <nav id="bottomNav">
    <button data-page="home" class="nav-btn"></button>
    <button data-page="learn" class="nav-btn"></button>
    <button data-page="mistakes" class="nav-btn"></button>
    <button data-page="me" class="nav-btn"></button>
  </nav>
  <div id="modalRoot"></div>
  <div id="toastRoot"></div>
  <pre id="RESULT">PENDING</pre>

  <script type="module" src="assets/js/app.js"></script>
  <script type="module">
    const sleep = ms => new Promise(r => setTimeout(r, ms));
    const app = document.getElementById('app');
    const out = [];

    async function visit(label, page, params) {
      const before = window.__errs.length;
      try {
        await window.__nav(page, params || {});
      } catch (e) {
        window.__errs.push('nav threw @' + page + ': ' + e.message);
      }
      await sleep(400);
      const html = app.innerHTML;
      const bad = /加载失败|模块加载失败|启动失败/.test(html);
      out.push({
        line: label, page,
        len: html.length,
        fail: bad,
        newErrs: window.__errs.length - before
      });
    }

    async function run() {
      // 装 SW 并等它接管（离线复跑要靠它）
      try {
        await navigator.serviceWorker.register('./sw.js');
        await navigator.serviceWorker.ready;
        for (let i = 0; i < 100 && !navigator.serviceWorker.controller; i++) await sleep(100);
      } catch (e) { window.__errs.push('sw register: ' + e.message); }

      // 等 app.js 的 bootstrap 跑完
      for (let i = 0; i < 40 && !window.__nav; i++) await sleep(100);
      if (!window.__nav) { document.getElementById('RESULT').textContent = 'BOOT-FAILED ' + JSON.stringify(window.__errs); return; }
      document.getElementById('modalRoot').innerHTML = ''; // 关掉首次访问欢迎弹窗
      const storage = await import('./assets/js/storage.js');

      // 线① 1-9 年级
      storage.setGrade(3);
      for (const p of ['home', 'learn', 'words', 'levels', 'grammar', 'reading', 'writing', 'mistakes', 'me', 'reinforce', 'timestats']) {
        await visit('grade3', p);
      }
      // P1a 语法大厅：大厅列表 + G01 课内页；P1b 起基石层全开，再抽 G12 验一课；P2a 骨架层 G13-G26 全开，抽首尾各一课
      await visit('grade3', 'grammar-hall');
      await visit('grade3', 'grammar-hall', { lesson: 'G01' });
      await visit('grade3', 'grammar-hall', { lesson: 'G12' });
      await visit('grade3', 'grammar-hall', { lesson: 'G13' });
      await visit('grade3', 'grammar-hall', { lesson: 'G26' });
      await visit('grade3', 'grammar-hall', { lesson: 'G29' }); // P3 样课：进阶层被动语态
      await visit('grade3', 'grammar-hall', { lesson: 'G32' }); // P3 续批首课：分词作定语与表语
      await visit('grade3', 'grammar-hall', { lesson: 'G42' }); // P3 收官：进阶层末课 构词法
      await visit('grade3', 'grammar-hall', { lesson: 'G43' }); // P4：精修层首课 虚拟语气初步
      await visit('grade3', 'grammar-hall', { lesson: 'G50' }); // P4 收官：50 课末课 中式英语16类

      // 语法大厅闯练引擎实跑：四环节列表 → 环节1 答满 16 题 → 结果页；侦探关提交一次
      const hallDrill = {};
      const click = async sel => { const el = app.querySelector(sel); if (!el) return false; el.click(); await sleep(250); return true; };
      hallDrill.stagesOpened = await click('#toStagesBtn');
      hallDrill.stage1Opened = await click('[data-stage="0"]');
      let answeredN = 0;
      for (let i = 0; i < 16; i++) {
        const opt = app.querySelector('[data-oi]');
        if (!opt) break;
        opt.click(); await sleep(150);
        const nx = app.querySelector('#nextBtn');
        if (!nx) break;
        nx.click(); await sleep(150);
        answeredN++;
      }
      hallDrill.answered16 = answeredN === 16;
      hallDrill.resultShown = !!app.querySelector('#stagesBtn');
      await window.__nav('grammar-hall', { lesson: 'G01' });
      await sleep(600);
      hallDrill.detectiveOpened = await click('#detectiveBtn');
      const fixIn = app.querySelector('#fixInput');
      if (fixIn) { fixIn.value = 'wrong answer on purpose'; await click('#submitBtn'); }
      hallDrill.detectiveFeedback = !!app.querySelector('#selfOk');
      storage.setGrade(8);
      for (const p of ['words', 'grammar', 'reading']) await visit('grade8', p);

      // 线② PET
      storage.setGrade('PET');
      for (const p of ['learn', 'words', 'reading']) await visit('PET', p);
      await visit('PET', 'petlevels', { topic: null });

      // 线③ KET 备考中心九模块（把 started 置真，走完整 Dashboard 而不是首次设置页）
      storage.setGrade('KET');
      storage.setExamProfile({ ...storage.getExamProfile(), level: 'KET', started: true });
      for (const p of ['exam-hub', 'exam-plan', 'exam-knowledge', 'exam-grammar', 'exam-reading', 'exam-writing', 'exam-mock', 'exam-checkin', 'exam-resources', 'exam-report']) {
        await visit('KET', p);
      }

      // === P2b 八课 ⇄ 语法大厅 双向跳转实点 ===
      const km = await import('./assets/js/utils/ket-hall-map.js');
      const p2b = { deepDive: {}, hallTag: {} };
      // ① 去程：每课的深挖按钮目标必须与映射表一致（八课全 8 课逐课查）
      for (const kid of ['L1', 'L2', 'L3', 'L4', 'L5', 'L6', 'L7', 'L8']) {
        await window.__nav('exam-grammar', { lesson: kid });
        await sleep(350);
        const got = [...app.querySelectorAll('[data-hall]')].map(b => b.dataset.hall).join(',');
        p2b.deepDive[kid] = { got, ok: got === km.KET_TO_HALL[kid].join(',') };
      }
      // ② 往返实点：L4 → 深挖 G07 → 返回 L4
      await window.__nav('exam-grammar', { lesson: 'L4' }); await sleep(350);
      const firstDeep = app.querySelector('[data-hall]');
      if (firstDeep) firstDeep.click();
      await sleep(700);
      p2b.jumpedToHall = /G07 ·/.test(app.innerHTML);
      p2b.backEntryShown = !!app.querySelector('#backKetBtn');
      p2b.noDupTagOnSource = !app.querySelector('[data-ket="L4"]'); // 来路那课不重复挂标签
      const backBtn = app.querySelector('#backKetBtn');
      if (backBtn) backBtn.click();
      await sleep(700);
      p2b.backToKetLesson = /L4 ·/.test(app.innerHTML) && !!app.querySelector('[data-hall]');
      // ③ 回程：有映射的课挂标签且跳得对；没映射的课不挂（保留星级一行）
      for (const [gid, want] of [['G13', 'L3'], ['G01', 'L8'], ['G24', 'L2'], ['G17', null], ['G26', null]]) {
        await window.__nav('grammar-hall', { lesson: gid });
        await sleep(600);
        const tag = app.querySelector('[data-ket]');
        p2b.hallTag[gid] = {
          tagged: !!tag, want, ok: want ? (tag && tag.dataset.ket === want) : !tag,
          starsKept: /KET 相关度/.test(app.innerHTML)
        };
      }
      await window.__nav('grammar-hall', { lesson: 'G13' }); await sleep(600);
      const ketTag = app.querySelector('[data-ket]');
      if (ketTag) ketTag.click();
      await sleep(700);
      p2b.tagJumpedToKet = /L3 ·/.test(app.innerHTML);
      p2b.roundTripClosed = !!app.querySelector('[data-hall="G13"]'); // 回到 L3 还能再跳回 G13

      // P0.5 三时钟自检：报名未开放 / 报名进行中 / 报名已结束 三种时点
      const ec = await import('./assets/js/modules/exam/exam-common.js');
      // 用本地日期拼串（不要 toISOString：那是 UTC，东八区早上 8 点前会差一天，daysUntil 按本地算）
      const iso = off => { const d = new Date(); d.setDate(d.getDate() + off); return d.getFullYear() + '-' + String(d.getMonth() + 1).padStart(2, '0') + '-' + String(d.getDate()).padStart(2, '0'); };
      const clockCases = [];
      for (const [name, o, c, e, want] of [
        ['报名未开放', 30, 60, 120, 'regOpen'],
        ['报名进行中', -5, 20, 90, 'regClose'],
        ['报名已结束', -60, -30, 10, null],
      ]) {
        ec.saveExamConfig({ regOpenDate: iso(o), regCloseDate: iso(c), examDate: iso(e) });
        const cl = ec.examClocks();
        clockCases.push({
          name,
          keys: cl.map(x => x.key),
          firstAsExpected: (cl[0] && cl[0].key !== 'exam' ? cl[0].key : null) === want,
          examAlwaysThere: cl.some(x => x.key === 'exam'),
          examDays: (cl.find(x => x.key === 'exam') || {}).days,
        });
        await visit('clock-' + name, 'exam-hub'); // 每种时点都要能渲染
      }
      // P0.6 考季派生自检：季名规则 + 占位符替换 + 改考试日后决策文案跟着变
      const es = await import('./assets/js/utils/exam-season.js');
      ec.saveExamConfig({ examDate: '2026-12-13', nextExamDate: '2027-03-14', nextExamLabel: '' });
      const seasonCheck = {
        byMonth: [1, 3, 6, 9, 12].map(m => es.seasonOf(m)).join('/'),
        current: es.getCurrentSeason().label,
        next: es.getNextSeason().label,
        filled: es.fillSeason('报{本考季}，不行就{下一考季}'),
      };
      storage.saveMockResult('KET', 'mock-03', { scaled: 100, readingPct: 50, writingRaw: 15 });
      seasonCheck.decisionLow = storage.getExamDecision('KET').action;
      storage.saveMockResult('KET', 'mock-03', { scaled: 140, readingPct: 90, writingRaw: 28 });
      seasonCheck.decisionHigh = storage.getExamDecision('KET').action;
      // 换个考试日 → 决策文案里的季名必须跟着变
      ec.saveExamConfig({ examDate: '2027-06-12' });
      seasonCheck.afterDateChange = storage.getExamDecision('KET').action;
      seasonCheck.noHardcodedYear = !/2027 春|2027 秋|2027 下半年/.test(
        [seasonCheck.decisionLow, seasonCheck.decisionHigh, seasonCheck.afterDateChange].join(' '));
      localStorage.removeItem('ea_examMocks');

      // 用户改值 → 即时生效
      ec.saveExamConfig({ targetScore: 150, examDate: iso(45) });
      const persisted = ec.examConfig();
      const clockCheck = {
        cases: clockCases,
        overrideWorks: persisted.targetScore === 150 && ec.daysToExam() === 45,
        tipFromConfig: /Find a centre/.test(persisted.registerTip || ''),
      };
      // 还原默认（清掉覆盖层），免得影响后面的离线复跑
      localStorage.removeItem('ea_examConfig');
      await ec.loadExamConfig(true);
      clockCheck.restored = ec.examConfig().targetScore;

      // 年级选择器回归（KET 那行文案 P0.5 起读配置）
      await ec.loadExamConfig(true);
      document.getElementById('gradeBtn').click();
      await sleep(500);
      const gpHtml = document.getElementById('modalRoot').innerHTML;
      const gpCfg = ec.examConfig();
      const gradePicker = {
        opened: gpHtml.length > 200,
        hasNineGrades: (gpHtml.match(/data-grade="[1-9]"/g) || []).length === 9,
        hasKET: /data-grade="KET"/.test(gpHtml),
        hasPET: /data-grade="PET"/.test(gpHtml),
        showsConfigDate: gpHtml.includes(gpCfg.examDate),
        showsConfigTarget: gpHtml.includes('目标 ' + gpCfg.targetScore + '+'),
        noHardcodedSeason: !/2027 春季|2027 秋/.test(gpHtml),
      };
      document.getElementById('modalRoot').innerHTML = '';

      // 懒加载器自检
      const lz = await import('./assets/js/utils/lazy-data.js');
      const gi = await lz.loadIndex('grammar');
      const ri = await lz.loadIndex('reader');
      const g01 = await lz.loadGrammarLesson('G01');     // P1a 起有真内容
      const g13 = await lz.loadGrammarLesson('G13');     // P2a 样课：骨架层首课
      const g26 = await lz.loadGrammarLesson('G26');     // P2a 收官：骨架层末课
      const g29 = await lz.loadGrammarLesson('G29');     // P3 样课：进阶层被动语态
      const g32 = await lz.loadGrammarLesson('G32');     // P3 续批首课
      const g42 = await lz.loadGrammarLesson('G42');     // P3 收官：进阶层末课
      const g43 = await lz.loadGrammarLesson('G43');     // P4：精修层首课
      const g50 = await lz.loadGrammarLesson('G50');     // P4 收官：50 课满编
      const missing = await lz.loadGrammarLesson('G51'); // 50 课已满编，G51 不存在，应返回 null 且不抛
      const stats = lz.cacheStats();

      // === 离线复跑：清掉内存缓存 → 服务器切断网 → 三条线再走一遍，全部靠 SW 缓存 ===
      const onlineCount = out.length;
      const errsBeforeOffline = window.__errs.length;
      lz.clearMemoryCache();
      // 带随机参数防被 SW 壳缓存拦下（sw.js 会缓存同源 200 响应，复用 profile 时必踩）
      await fetch('/__offline?t=' + Date.now() + Math.random()).catch(() => {});
      await sleep(300);
      storage.setGrade(3);
      for (const p of ['home', 'words', 'levels', 'grammar', 'reading', 'writing', 'mistakes', 'me']) await visit('offline-grade3', p);
      // 语法大厅离线：索引在壳缓存，g01/g13/g26.json 在线访问过 → 内容缓存可读
      await visit('offline-grade3', 'grammar-hall');
      await visit('offline-grade3', 'grammar-hall', { lesson: 'G01' });
      await visit('offline-grade3', 'grammar-hall', { lesson: 'G13' });
      await visit('offline-grade3', 'grammar-hall', { lesson: 'G26' });
      await visit('offline-grade3', 'grammar-hall', { lesson: 'G29' });
      await visit('offline-grade3', 'grammar-hall', { lesson: 'G32' });
      await visit('offline-grade3', 'grammar-hall', { lesson: 'G42' });
      await visit('offline-grade3', 'grammar-hall', { lesson: 'G43' });
      await visit('offline-grade3', 'grammar-hall', { lesson: 'G50' });
      // P2b 离线：带 fromKet 的深挖落地页（G07 在线访问过 → 内容缓存可读；映射表在壳里）
      await visit('offline-grade3', 'grammar-hall', { lesson: 'G07', fromKet: 'L4' });
      p2b.offlineBackEntry = !!app.querySelector('#backKetBtn');
      await visit('offline-grade3', 'grammar-hall', { lesson: 'G13' });
      p2b.offlineHallTag = !!app.querySelector('[data-ket="L3"]');
      storage.setGrade('PET');
      for (const p of ['words', 'reading']) await visit('offline-PET', p);
      storage.setGrade('KET');
      for (const p of ['exam-hub', 'exam-plan', 'exam-knowledge', 'exam-grammar', 'exam-reading', 'exam-writing', 'exam-mock', 'exam-resources']) await visit('offline-KET', p);
      await visit('offline-KET', 'exam-grammar', { lesson: 'L4' });
      p2b.offlineDeepDive = [...app.querySelectorAll('[data-hall]')].map(b => b.dataset.hall).join(',') === 'G07,G14,G15';
      const offlineRoutes = out.slice(onlineCount);
      await fetch('/__online?t=' + Date.now() + Math.random()).catch(() => {});

      const payload = {
        routes: out,
        summary: {
          online: { total: onlineCount, failed: out.slice(0, onlineCount).filter(r => r.fail).length },
          offline: { total: offlineRoutes.length, failed: offlineRoutes.filter(r => r.fail).length,
                     newErrs: window.__errs.length - errsBeforeOffline }
        },
        clocks: clockCheck,
        season: seasonCheck,
        hallDrill,
        p2b,
        gradePicker,
        lazy: {
          grammarIndex: gi && gi.type,
          grammarTiers: gi && gi.tiers.length,
          grammarLessons: gi && gi.lessons.length,
          readerIndex: ri && ri.type,
          readerVolumes: ri && ri.volumes.length,
          g01Loaded: !!(g01 && g01.id === 'G01' && g01.practice.stages.length === 4 && g01.detective.length === 8),
          g13Loaded: !!(g13 && g13.id === 'G13' && g13.practice.stages.length === 4 && g13.detective.length === 7),
          g26Loaded: !!(g26 && g26.id === 'G26' && g26.practice.stages.length === 4 && g26.detective.length === 7),
          g29Loaded: !!(g29 && g29.id === 'G29' && g29.practice.stages.length === 4 && g29.detective.length === 7),
          g32Loaded: !!(g32 && g32.id === 'G32' && g32.practice.stages.length === 4 && g32.detective.length === 7),
          g42Loaded: !!(g42 && g42.id === 'G42' && g42.practice.stages.length === 4 && g42.detective.length === 7),
          g43Loaded: !!(g43 && g43.id === 'G43' && g43.practice.stages.length === 4 && g43.detective.length === 7),
          g50Loaded: !!(g50 && g50.id === 'G50' && g50.practice.stages.length === 4 && g50.detective.length === 8),
          missingLessonReturnsNull: missing === null,
          skeletonOk: lz.skeletonHTML(3).includes('正在加载'),
          stats
        },
        errs: window.__errs
      };
      document.getElementById('RESULT').textContent = JSON.stringify(payload, null, 1);
      try { await fetch('/__result', { method: 'POST', body: JSON.stringify(payload, null, 1) }); } catch (e) {}
      storage.setGrade(3);
    }
    run();
  </script>
</body>
</html>
